# Holt Tarife, Betreiber und Fahrzeuge täglich aus Google Sheets und legt sie als CSV in data/ ab.
# Einrichtung: In Google Sheets je Tabellenblatt "Datei > Teilen > Im Web veröffentlichen > CSV" wählen,
# die drei Links in GitHub unter Settings > Secrets and variables > Actions als Secrets anlegen:
#   SHEET_OPERATORS_URL, SHEET_TARIFFS_URL, SHEET_VEHICLES_URL
name: Daten aus Google Sheets holen
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSV herunterladen
        run: |
          mkdir -p data
          curl -fsSL "${{ secrets.SHEET_OPERATORS_URL }}" -o data/operators.csv
          curl -fsSL "${{ secrets.SHEET_TARIFFS_URL }}" -o data/tariffs.csv
          curl -fsSL "${{ secrets.SHEET_VEHICLES_URL }}" -o data/vehicles.csv
      - name: Änderungen speichern
        run: |
          git config user.name "elveo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
